<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071321">
<title>Mini Battle Arena — 3D FPS</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="loading">LOADING BATTLEFIELD…</div>
<div id="app">
  <header><div class="brand">MINI <b>BATTLE</b> ARENA</div><div class="topstats"><span id="coins">◆ 0</span><span id="level">LV 1</span></div></header>
  <section id="menu" class="panel">
    <div class="eyebrow">ONLINE-STYLE FPS • SEASON 01</div><h1>DROP INTO<br><em>COMBAT</em></h1>
    <p>Fast 3D arena combat. Aim, move and eliminate enemy bots.</p>
    <label>CHOOSE YOUR CLASS</label><div class="heroes">
      <button class="hero selected" data-hero="ROBO">🤖<small>ROBO</small></button>
      <button class="hero" data-hero="BLAZE">🔥<small>BLAZE</small></button>
      <button class="hero" data-hero="TITAN">🛡️<small>TITAN</small></button>
      <button class="hero" data-hero="VOLT">⚡<small>VOLT</small></button>
    </div>
    <label>PLAY MODE</label><div class="modes">
      <button class="mode selected" data-mode="solo">SOLO <small>5 ENEMIES</small></button>
      <button class="mode" data-mode="survival">SURVIVAL <small>12 ENEMIES</small></button>
      <button class="mode" data-mode="practice">PRACTICE <small>2 ENEMIES</small></button>
    </div>
    <button id="start" class="primary">▶ DEPLOY</button>
    <div class="menufoot">LEFT THUMB MOVE • DRAG RIGHT SIDE TO AIM • FIRE</div>
  </section>
  <div id="lookzone" aria-label="Drag to aim"></div>
  <div id="crosshair"><i></i><b></b><em></em><strong></strong></div>
  <div id="hitmarker">✕</div><div id="damageflash"></div>
  <div id="hud" class="hidden">
    <div class="hudtop">
      <div class="health"><span>HP</span><div><i id="hpbar"></i></div><b id="hptext">100</b></div>
      <div class="round" id="round">KILLS 0 / 5</div>
    </div>
    <div class="weapon" id="weapon">PULSE RIFLE</div>
    <div class="controls">
      <div id="stick"><div id="nub"></div></div>
      <div class="rightcontrols"><button id="switch">SWAP</button><button id="fire">FIRE</button><button id="jump">JUMP</button></div>
    </div>
    <button id="pause">Ⅱ</button>
  </div>
  <div id="result" class="panel hidden"><div class="eyebrow">MATCH COMPLETE</div><h1 id="resulttitle">VICTORY</h1><p id="resulttext"></p><button id="again" class="primary">PLAY AGAIN</button><button id="home" class="secondary">MAIN MENU</button></div>
  <div id="toast"></div>
</div>
<script type="module" src="game.js?v=4"></script>
</body></html>
